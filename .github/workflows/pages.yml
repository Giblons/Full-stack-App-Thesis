name: Deploy demo to GitHub Pages

# Publishes a static, in-browser demo (mock drone — no API server) of the
# customer app + GCS to GitHub Pages so it can be opened on any phone/tablet.
#
# Runs on pushes to main and to the thin-slice branch, and can be run manually.

on:
  push:
    branches:
      - main
      - cursor/drone-delivery-thin-slice-52fe
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # Enable Pages automatically and expose the site's base_path/origin.
      - name: Configure Pages
        id: pages
        uses: actions/configure-pages@v5
        with:
          enablement: true
      - name: Build combined site
        env:
          PAGES_BASE: ${{ steps.pages.outputs.base_path }}
        run: npm run build:pages
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
